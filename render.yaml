services:
  - type: web
    name: kimchi-premium
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    # 봇이 30분마다 커밋하는 데이터 파일로는 재배포하지 않음 (재배포마다 설정 초기화되던 문제 방지)
    buildFilter:
      ignoredPaths:
        - data.json
        - alert_state.json
        - alert_config.json
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CHAT_ID
        sync: false
