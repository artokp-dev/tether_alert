<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>김치 프리미엄</title>
<meta name="theme-color" content="#0a0a0f">
<link rel="preconnect" href="https://api.upbit.com">
<link rel="preconnect" href="https://api.bithumb.com">
<link rel="preconnect" href="https://api.allorigins.win">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="김프">
<style>
  html,body{margin:0;min-height:100%;background:#0a0a0f;color:#fff;
    font-family:-apple-system,'Malgun Gothic',sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 0;box-sizing:border-box;}
  .label{font-size:15px;color:#888;letter-spacing:3px;}
  .row{display:flex;width:100%;max-width:520px;}
  .ex{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 8px;}
  .ex + .ex{border-left:1px solid #1e1e2e;}
  .exname{font-size:14px;color:#aaa;letter-spacing:2px;font-weight:700;}
  .kimp{font-size:clamp(30px,13vw,74px);font-weight:800;line-height:1;}
  .kimp.pos{color:#ff4d5e;} .kimp.neg{color:#3d9bff;}
  .price{font-size:13px;color:#777;}
  .card{width:100%;max-width:520px;padding:0 16px;box-sizing:border-box;}
  .spread{display:flex;justify-content:space-between;align-items:center;
    background:#12121a;border:1px solid #1e1e2e;border-radius:12px;padding:14px 16px;}
  .spread .lbl{font-size:13px;color:#888;}
  .spread .v{font-weight:800;font-size:22px;font-family:'Menlo',monospace;color:#e8e8f5;}
  .spread.hot{border-color:#ff4d5e;background:rgba(255,77,94,.08);}
  .spread.hot .v{color:#ff4d5e;}
  .goldbox{background:#12121a;border:1px solid #1e1e2e;border-radius:12px;padding:14px 16px;}
  .goldbox h3{font-size:11px;color:#888;letter-spacing:1px;margin:0 0 10px;font-weight:700;}
  .goldrow{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .gitem{text-align:center;flex:1;}
  .gname{font-size:12px;color:#888;}
  .gval{font-family:'Menlo',monospace;font-size:15px;font-weight:700;color:#e8e8f5;margin-top:3px;}
  .gunit{font-size:10px;color:#666;}
  .gprem{font-size:clamp(24px,9vw,42px);font-weight:800;line-height:1;color:#888;}
  .gprem.pos{color:#ffcc00;} .gprem.neg{color:#3d9bff;}
  .gsub{font-size:11px;color:#666;text-align:center;margin-top:10px;}
  .ctrl{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;}
  .ctrl label{font-size:13px;color:#888;}
  .ctrl input{width:52px;background:#12121a;border:1px solid #1e1e2e;color:#fff;
    border-radius:8px;padding:8px;font-size:15px;text-align:center;}
  #alarmBtn{background:#00ff88;color:#0a0a0f;border:none;border-radius:10px;
    padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;}
  #alarmBtn.on{background:rgba(0,255,136,.12);color:#00ff88;border:1px solid #00ff88;}
  .sub{font-size:13px;color:#666;text-align:center;line-height:1.7;padding:0 12px;}
  .sub b{color:#aaa;}
  .t{font-size:12px;color:#444;min-height:16px;text-align:center;}
  .flash{position:fixed;top:0;left:0;right:0;background:#ff4d5e;color:#fff;
    text-align:center;padding:18px 12px;font-weight:800;font-size:16px;
    transform:translateY(-110%);transition:transform .3s;z-index:99;
    padding-top:calc(18px + env(safe-area-inset-top));}
  .flash.show{transform:translateY(0);}
</style>
</head>
<body>
  <div class="flash" id="flash"></div>
  <div class="label">김치 프리미엄</div>
  <div class="row">
    <div class="ex">
      <div class="exname">업비트</div>
      <div class="kimp" id="upKimp">…</div>
      <div class="price" id="upPrice"></div>
    </div>
    <div class="ex">
      <div class="exname">빗썸</div>
      <div class="kimp" id="biKimp">…</div>
      <div class="price" id="biPrice"></div>
    </div>
  </div>

  <div class="card">
    <div class="spread" id="spreadBox">
      <span class="lbl">업비트·빗썸 테더 차이</span>
      <span class="v" id="spreadVal">—</span>
    </div>
  </div>

  <div class="card">
    <div class="goldbox">
      <h3>금 김치 프리미엄 (국내 KRX vs 국제)</h3>
      <div class="goldrow">
        <div class="gitem"><div class="gname">국내 금</div><div class="gval" id="goldDom">—</div><div class="gunit">원/g</div></div>
        <div class="gitem"><div class="gprem" id="goldPrem">—</div></div>
        <div class="gitem"><div class="gname">국제(환산)</div><div class="gval" id="goldIntl">—</div><div class="gunit">원/g</div></div>
      </div>
      <div class="gsub" id="goldSub"></div>
    </div>
  </div>

  <div class="ctrl">
    <label>거래소 차이 <input id="thr" type="number" value="3" min="0.5" step="0.5" inputmode="decimal"></label>
    <span style="font-size:13px;color:#888">원 이상</span>
  </div>
  <div class="ctrl">
    <label>김프 <input id="pHigh" type="number" value="0" step="0.1" inputmode="decimal">% 위</label>
    <span style="font-size:13px;color:#888">또는</span>
    <label><input id="pLow" type="number" value="-1.5" step="0.1" inputmode="decimal">% 아래</label>
  </div>
  <div class="ctrl">
    <button id="alarmBtn">🔔 소리 알림 켜기</button>
  </div>

  <div class="sub" id="sub">불러오는 중…</div>
  <div class="t" id="t"></div>

<script>
const VER = 'v14';
let alarmOn = false, audioCtx = null, lastAlert = 0, lastPremAlert = 0;

const thrEl = document.getElementById('thr');
const pHighEl = document.getElementById('pHigh');
const pLowEl = document.getElementById('pLow');
thrEl.value = localStorage.getItem('kimp_thr') || '3';
pHighEl.value = localStorage.getItem('kimp_pHigh') || '0';
pLowEl.value = localStorage.getItem('kimp_pLow') || '-1.5';
thrEl.onchange = () => localStorage.setItem('kimp_thr', thrEl.value);
pHighEl.onchange = () => localStorage.setItem('kimp_pHigh', pHighEl.value);
pLowEl.onchange = () => localStorage.setItem('kimp_pLow', pLowEl.value);

document.getElementById('alarmBtn').onclick = function(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    beep();
  }catch(e){}
  if('Notification' in window && Notification.permission !== 'granted'){
    try{ Notification.requestPermission(); }catch(e){}
  }
  alarmOn = true;
  this.textContent = '🔔 알림 켜짐 ✅';
  this.classList.add('on');
  repaint();   // 켜는 즉시 현재 값으로 조건 확인
};

function beep(){
  if(!audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.type = 'sine'; o.frequency.value = 880;
  const now = audioCtx.currentTime;
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.4, now + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
  o.start(now); o.stop(now + 0.17);
}

// 공통 알림: 소리 + 진동 + 화면 배너 + (권한 있으면) 시스템 알림
function notify(banner, title, body){
  beep(); setTimeout(beep, 220); setTimeout(beep, 440);
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
  const f = document.getElementById('flash');
  f.textContent = banner;
  f.classList.add('show');
  setTimeout(()=>f.classList.remove('show'), 4000);
  if('Notification' in window && Notification.permission === 'granted'){
    try{ new Notification(title, { body: body, icon: 'icon-192.png' }); }catch(e){}
  }
}

function fireAlert(sp, up, bi){
  const dir = up > bi ? '업비트 > 빗썸' : '빗썸 > 업비트';
  notify(`🚨 테더 차이 ${sp.toFixed(1)}원 (${dir})`,
         '🚨 USDT 차익 ' + sp.toFixed(1) + '원',
         `업비트 ${up.toLocaleString()}원 · 빗썸 ${bi.toLocaleString()}원 (${dir})`);
}

function firePremium(avg){
  const arrow = avg >= 0 ? '▲' : '▼';
  notify(`${arrow} 김치 프리미엄 ${avg.toFixed(2)}%`,
         `${arrow} 김프 ${avg.toFixed(2)}%`,
         `설정 기준 도달 (${pLowEl.value}% 아래 또는 ${pHighEl.value}% 위)`);
}

function paint(elId, priceId, price, prem){
  const el = document.getElementById(elId);
  if(price == null || prem == null){ el.textContent = '—'; return; }
  el.textContent = (prem>=0?'+':'') + prem.toFixed(2) + '%';
  el.className = 'kimp ' + (prem>=0?'pos':'neg');
  document.getElementById(priceId).textContent = '테더 ' + price.toLocaleString() + '원';
}

// 환율 = 서버(data.json), 가격 = 폰이 직접 실시간. 실패하면 서버값으로 대체.
let rate = null, rateSrc = '', fbUp = null, fbBi = null;
let curUp = null, curBi = null;   // 현재 표시 중인 가격 (환율만 바뀌어도 다시 그리기 위함)
let gold = {};                    // 금 데이터 (data.json 에서, 약 5분마다 갱신)

function fetchJson(url, ms){
  const c = new AbortController();
  const t = setTimeout(()=>c.abort(), ms || 3000);
  return fetch(url, {signal:c.signal, cache:'no-store'})
    .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .finally(()=>clearTimeout(t));
}
// 직접 호출 실패 시 CORS 우회 통로(2개)로 재시도
async function fetchAny(url, ms){
  try{ return await fetchJson(url, ms); }catch(e){}
  try{ return await fetchJson('https://api.allorigins.win/raw?url=' + encodeURIComponent(url), (ms||3000)+3500); }catch(e){}
  return await fetchJson('https://corsproxy.io/?url=' + encodeURIComponent(url), (ms||3000)+3500);
}

// 환율 + 예비 가격 (60초마다)
const YAHOO = 'https://query1.finance.yahoo.com/v8/finance/chart/KRW=X?interval=1m&range=1d';
const DUNAMU = 'https://quotation-api-cdn.dunamu.com/v1/forex/recent?codes=FRX.KRWUSD';
async function loadServer(){
  let rateOk = false;
  // 프록시가 옛 값을 캐시하지 못하도록 매번 주소를 다르게(cache-buster)
  const cb = '&_t=' + Date.now();
  // 1) 24시간 시장환율 (야후 인터뱅크) — 평일엔 밤에도 갱신
  try{
    const y = await fetchAny(YAHOO + cb, 2500);
    const r0 = y && y.chart && y.chart.result && y.chart.result[0];
    const m = r0 && r0.meta;
    if(m && m.regularMarketPrice){ rate = m.regularMarketPrice; rateSrc = '시장환율'; rateOk = true; }
  }catch(e){}
  // 2) 하나은행 고시환율 (두나무 제공) — 시장환율 실패 시
  if(!rateOk){
    try{
      const fx = await fetchAny(DUNAMU + cb, 4000);
      if(fx && fx[0] && fx[0].basePrice){ rate = fx[0].basePrice; rateSrc = '하나은행'; rateOk = true; }
    }catch(e){}
  }
  // 3) 서버 data.json → 환율 백업 + 예비 가격(폰에서 시세가 막힐 때 대체용)
  try{
    const d = await fetch('./data.json?t=' + Date.now(), {cache:'no-store'}).then(r=>r.json());
    if(!rateOk && d.usd_krw != null){ rate = d.usd_krw; rateSrc = d.rate_src || '서버'; }
    if(d.upbit != null) fbUp = d.upbit;
    if(d.bithumb != null) fbBi = d.bithumb;
    gold = { dom: d.gold_domestic, intl: d.gold_intl_krw_g, prem: d.gold_premium, oz: d.gold_intl_usd_oz };
    renderGold();
  }catch(e){}
  repaint();   // 새 환율을 즉시 화면에 반영 (다음 가격 갱신까지 안 기다림)
}

function renderGold(){
  const domEl = document.getElementById('goldDom');
  const intlEl = document.getElementById('goldIntl');
  const premEl = document.getElementById('goldPrem');
  const subEl = document.getElementById('goldSub');
  if(!domEl) return;
  domEl.textContent  = gold.dom  != null ? Number(gold.dom).toLocaleString()  : '—';
  intlEl.textContent = gold.intl != null ? Number(gold.intl).toLocaleString() : '—';
  if(gold.prem != null){
    premEl.textContent = (gold.prem>=0?'+':'') + gold.prem.toFixed(2) + '%';
    premEl.className = 'gprem ' + (gold.prem>=0?'pos':'neg');
  }else{
    premEl.textContent = '—'; premEl.className = 'gprem';
  }
  subEl.textContent = gold.oz != null ? `국제 금 $${Number(gold.oz).toLocaleString()}/oz · 약 5분마다` : '금 시세 불러오는 중…';
}

// 화면 그리기 (현재 rate + 주어진 가격으로)
function paintAll(up, bi){
  if(rate == null){
    document.getElementById('sub').textContent = '불러오는 중…';
    document.getElementById('t').textContent = VER;
    return;
  }
  const upP = up != null ? (up/rate - 1) * 100 : null;
  const biP = bi != null ? (bi/rate - 1) * 100 : null;
  paint('upKimp','upPrice', up, upP);
  paint('biKimp','biPrice', bi, biP);

  if(up != null && bi != null){
    const sp = Math.abs(up - bi);
    const thr = parseFloat(thrEl.value) || 3;
    document.getElementById('spreadVal').textContent = sp.toFixed(1) + '원';
    document.getElementById('spreadBox').className = 'spread' + (sp >= thr ? ' hot' : '');
    if(alarmOn && sp >= thr && Date.now() - lastAlert > 60000){
      lastAlert = Date.now();
      fireAlert(sp, up, bi);
    }
  }

  // 김프 알림 (설정한 상단% 위 또는 하단% 아래)
  const prems = [upP, biP].filter(v => v != null);
  if(alarmOn && prems.length){
    const avg = prems.reduce((a,b)=>a+b,0) / prems.length;
    const pHigh = parseFloat(pHighEl.value);
    const pLow = parseFloat(pLowEl.value);
    const hit = (!isNaN(pHigh) && avg >= pHigh) || (!isNaN(pLow) && avg <= pLow);
    if(hit && Date.now() - lastPremAlert > 60000){
      lastPremAlert = Date.now();
      firePremium(avg);
    }
  }

  document.getElementById('sub').innerHTML =
    `실제 환율 <b>${Number(rate).toLocaleString()}원</b> (${rateSrc})`;
  document.getElementById('t').textContent =
    new Date().toLocaleTimeString('ko-KR') + ' · 실시간(20초) · ' + VER;
}

// 현재 값으로 다시 그리기 (환율이든 가격이든 뭐가 바뀌어도 호출)
function repaint(){ paintAll(curUp, curBi); }

// 실시간 가격 (20초마다) → 김프 계산·표시
async function tick(){
  let up = fbUp, bi = fbBi;
  await Promise.all([
    fetchAny('https://api.upbit.com/v1/ticker?markets=KRW-USDT', 3000).then(u=>{ up = u[0].trade_price; }).catch(()=>{}),
    fetchAny('https://api.bithumb.com/public/ticker/USDT_KRW', 3000).then(b=>{ bi = parseFloat(b.data.closing_price); }).catch(()=>{}),
  ]);
  curUp = up; curBi = bi;
  repaint();
}

// 켤 때: 서버 저장값(같은 주소라 즉시)으로 화면 먼저 띄우고, 실시간은 뒤에서 갱신
(async function init(){
  try{
    const d = await fetch('./data.json?t=' + Date.now(), {cache:'no-store'}).then(r=>r.json());
    if(d.usd_krw != null){ rate = d.usd_krw; rateSrc = d.rate_src || '서버'; }
    if(d.upbit != null) fbUp = d.upbit;
    if(d.bithumb != null) fbBi = d.bithumb;
    curUp = fbUp; curBi = fbBi;
    repaint();   // 1초 안에 첫 화면
  }catch(e){}

  loadServer();   // 실시간 환율 (백그라운드)
  tick();          // 실시간 가격
  setInterval(loadServer, 60000);
  setInterval(tick, 20000);
})();
</script>
</body>
</html>
