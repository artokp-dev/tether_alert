<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>김치 프리미엄</title>
<meta name="theme-color" content="#0a0a0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<!-- 홈 화면 앱(전체화면) 설정 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="김프">
<style>
  html,body{margin:0;min-height:100%;background:#0a0a0f;color:#fff;
    font-family:-apple-system,'Malgun Gothic',sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 0;box-sizing:border-box;}
  .label{font-size:15px;color:#888;letter-spacing:3px;}
  .row{display:flex;width:100%;max-width:520px;}
  .ex{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 8px;}
  .ex + .ex{border-left:1px solid #1e1e2e;}
  .exname{font-size:14px;color:#aaa;letter-spacing:2px;font-weight:700;}
  .kimp{font-size:clamp(30px,13vw,74px);font-weight:800;line-height:1;transition:opacity .3s;}
  .kimp.pos{color:#ff4d5e;} .kimp.neg{color:#3d9bff;} .kimp.stale{opacity:.45;}
  .price{font-size:13px;color:#777;}
  .card{width:100%;max-width:520px;padding:0 16px;box-sizing:border-box;}
  .spread{display:flex;justify-content:space-between;align-items:center;
    background:#12121a;border:1px solid #1e1e2e;border-radius:12px;padding:14px 16px;}
  .spread .lbl{font-size:13px;color:#888;}
  .spread .v{font-weight:800;font-size:22px;font-family:'Menlo',monospace;color:#e8e8f5;}
  .spread.hot{border-color:#ff4d5e;background:rgba(255,77,94,.08);}
  .spread.hot .v{color:#ff4d5e;}
  .ctrl{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;}
  .ctrl label{font-size:13px;color:#888;}
  .ctrl input{width:52px;background:#12121a;border:1px solid #1e1e2e;color:#fff;
    border-radius:8px;padding:8px;font-size:15px;text-align:center;}
  #alarmBtn{background:#00ff88;color:#0a0a0f;border:none;border-radius:10px;
    padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;}
  #alarmBtn.on{background:rgba(0,255,136,.12);color:#00ff88;border:1px solid #00ff88;}
  .sub{font-size:13px;color:#666;text-align:center;line-height:1.7;padding:0 12px;}
  .sub b{color:#aaa;}
  .t{font-size:12px;color:#444;min-height:16px;}
  .flash{position:fixed;top:0;left:0;right:0;background:#ff4d5e;color:#fff;
    text-align:center;padding:18px 12px;font-weight:800;font-size:16px;
    transform:translateY(-110%);transition:transform .3s;z-index:99;
    padding-top:calc(18px + env(safe-area-inset-top));}
  .flash.show{transform:translateY(0);}
</style>
</head>
<body>
  <div class="flash" id="flash"></div>
  <div class="label">김치 프리미엄</div>
  <div class="row">
    <div class="ex">
      <div class="exname">업비트</div>
      <div class="kimp" id="upKimp">…</div>
      <div class="price" id="upPrice"></div>
    </div>
    <div class="ex">
      <div class="exname">빗썸</div>
      <div class="kimp" id="biKimp">…</div>
      <div class="price" id="biPrice"></div>
    </div>
  </div>

  <div class="card">
    <div class="spread" id="spreadBox">
      <span class="lbl">업비트·빗썸 테더 차이</span>
      <span class="v" id="spreadVal">—</span>
    </div>
  </div>

  <div class="ctrl">
    <label>알림 기준 <input id="thr" type="number" value="3" min="0.5" step="0.5" inputmode="decimal"></label>
    <span style="font-size:13px;color:#888">원 이상</span>
    <button id="alarmBtn">🔔 소리 알림 켜기</button>
  </div>

  <div class="sub" id="sub">불러오는 중…</div>
  <div class="t" id="t"></div>

<script>
// 각 소스의 마지막 성공값 기억 → 순간 실패해도 화면 유지 (조회 실패 안 뜸)
let lastUp = null, lastBi = null, lastRate = null, lastSrc = '', lastUpdated = '';
// 알림 상태
let alarmOn = false, audioCtx = null, lastAlert = 0;

const thrEl = document.getElementById('thr');
thrEl.value = localStorage.getItem('kimp_thr') || '3';
thrEl.onchange = () => localStorage.setItem('kimp_thr', thrEl.value);

// 소리 알림은 사용자가 버튼을 눌러야 켜짐(브라우저 자동재생 정책)
document.getElementById('alarmBtn').onclick = function(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    beep(); // 테스트 삐 소리
  }catch(e){}
  if('Notification' in window && Notification.permission !== 'granted'){
    try{ Notification.requestPermission(); }catch(e){}
  }
  alarmOn = true;
  this.textContent = '🔔 알림 켜짐 ✅';
  this.classList.add('on');
};

function beep(){
  if(!audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.type = 'sine'; o.frequency.value = 880;
  const now = audioCtx.currentTime;
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.4, now + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
  o.start(now); o.stop(now + 0.17);
}

function fireAlert(sp){
  const dir = lastUp > lastBi ? '업비트 > 빗썸' : '빗썸 > 업비트';
  beep(); setTimeout(beep, 220); setTimeout(beep, 440);   // 삐-삐-삐
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
  const f = document.getElementById('flash');
  f.textContent = `🚨 테더 차이 ${sp.toFixed(1)}원 (${dir})`;
  f.classList.add('show');
  setTimeout(()=>f.classList.remove('show'), 4000);
  if('Notification' in window && Notification.permission === 'granted'){
    try{
      new Notification('🚨 USDT 차익 ' + sp.toFixed(1) + '원', {
        body: `업비트 ${lastUp.toLocaleString()}원 · 빗썸 ${lastBi.toLocaleString()}원 (${dir})`,
        icon: 'icon-192.png'
      });
    }catch(e){}
  }
}

function fetchJson(url, ms){
  const c = new AbortController();
  const t = setTimeout(()=>c.abort(), ms || 4000);
  return fetch(url,{signal:c.signal,cache:'no-store'})
    .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .finally(()=>clearTimeout(t));
}

// 직접 호출을 먼저 시도하고, 막히면(폰 CORS 등) 우회 통로로 재시도
async function fetchAny(url, ms){
  try{ return await fetchJson(url, ms); }
  catch(e){
    return await fetchJson('https://api.allorigins.win/raw?url=' + encodeURIComponent(url), (ms||4000)+3500);
  }
}

async function getUpbit(){
  const u = await fetchAny('https://api.upbit.com/v1/ticker?markets=KRW-USDT');
  return u[0].trade_price;
}
async function getBithumb(){
  const b = await fetchAny('https://api.bithumb.com/public/ticker/USDT_KRW');
  return parseFloat(b.data.closing_price);
}
function parseDunamu(fx){
  const f0 = fx && fx[0];
  if(f0 && f0.basePrice){
    let up = '';
    if(f0.timestamp) up = new Date(f0.timestamp).toLocaleTimeString('ko-KR');
    else if(f0.date && f0.time) up = String(f0.time).slice(0,5);
    return {rate: f0.basePrice, src:'두나무', updated: up};
  }
  return null;
}

async function getRate(){
  const DUNAMU = 'https://quotation-api-cdn.dunamu.com/v1/forex/recent?codes=FRX.KRWUSD';
  // 두나무 기준환율 (직접 → 막히면 우회 통로로 재시도)
  try{ const r = parseDunamu(await fetchAny(DUNAMU, 5000)); if(r) return r; }catch(e){}
  // 최후의 백업: 무료 환율 API (하루 1회만 갱신 → 값이 고정됨)
  const fx = await fetchJson('https://open.er-api.com/v6/latest/USD');
  return {rate: fx.rates.KRW, src:'백업·하루1회', updated: ''};
}

function paint(elId, priceId, price, rate, fresh){
  const el = document.getElementById(elId);
  if(price === null || rate === null){ return; }
  const k = (price/rate - 1) * 100;
  el.textContent = (k>=0?'+':'') + k.toFixed(2) + '%';
  el.className = 'kimp ' + (k>=0?'pos':'neg') + (fresh ? '' : ' stale');
  document.getElementById(priceId).textContent = '테더 ' + price.toLocaleString() + '원';
}

async function load(){
  let fUp=false, fBi=false, fRate=false;
  await Promise.all([
    getUpbit().then(v=>{lastUp=v; fUp=true;}).catch(()=>{}),
    getBithumb().then(v=>{lastBi=v; fBi=true;}).catch(()=>{}),
    getRate().then(o=>{lastRate=o.rate; lastSrc=o.src; lastUpdated=o.updated; fRate=true;}).catch(()=>{}),
  ]);

  if(lastRate === null || (lastUp === null && lastBi === null)){
    document.getElementById('sub').textContent = '연결 재시도 중…';
    return;
  }

  paint('upKimp','upPrice', lastUp, lastRate, fUp && fRate);
  paint('biKimp','biPrice', lastBi, lastRate, fBi && fRate);

  // 업비트·빗썸 테더 가격 차이 + 알림
  if(lastUp !== null && lastBi !== null){
    const sp = Math.abs(lastUp - lastBi);
    const thr = parseFloat(thrEl.value) || 3;
    document.getElementById('spreadVal').textContent = sp.toFixed(1) + '원';
    document.getElementById('spreadBox').className = 'spread' + (sp >= thr ? ' hot' : '');
    if(alarmOn && sp >= thr && Date.now() - lastAlert > 60000){
      lastAlert = Date.now();
      fireAlert(sp);
    }
  }

  document.getElementById('sub').innerHTML =
    `실제 환율 <b>${Number(lastRate).toLocaleString()}원</b> ` +
    `(${lastSrc}${lastUpdated ? ' · ' + lastUpdated + ' 갱신' : ''})`;
  const allFresh = fUp && fBi && fRate;
  document.getElementById('t').textContent =
    new Date().toLocaleTimeString('ko-KR') + ' 기준' + (allFresh ? '' : ' · 일부 갱신 지연');
}

load();
setInterval(load, 5000);
</script>
</body>
</html>
